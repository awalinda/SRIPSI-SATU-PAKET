name: satupaket
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.11.0
  firebase_auth: ^5.5.0
  google_sign_in: ^6.2.2
  fl_chart: ^1.2.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  image_picker: ^1.1.2
  intl: ^0.20.2
  pdf: ^3.12.0
  printing: ^5.14.3
  excel: ^4.0.6
  google_fonts: ^8.1.0
  mobile_scanner: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - lib/assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "lib/assets/images/ic_launcher.png"
  min_sdk_android: 21